<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>SET Game - v1.0.0</title>
    <style>
        /* 見た目を整えるCSS */
        body { font-family: 'Helvetica Neue', Arial, sans-serif; text-align: center; background-color: #eef2f3; color: #333; margin: 0; padding: 20px; }
        #setup-screen { margin-top: 50px; background: white; padding: 30px; display: inline-block; border-radius: 20px; box-shadow: 0 10px 20px rgba(0,0,0,0.1); }
        #game-screen { display: none; }
        
        #field { 
            display: grid; grid-template-columns: repeat(4, 1fr); 
            gap: 15px; max-width: 800px; margin: 20px auto; padding: 20px;
        }

        .card {
            background: white; border: 3px solid #ddd; border-radius: 15px;
            padding: 5px; cursor: pointer; aspect-ratio: 2/3;
            transition: transform 0.1s, border-color 0.2s;
            overflow: hidden;
        }
        .card:hover { transform: scale(1.03); }
        .card.selected { border-color: #ff4757; background-color: #fffaf0; box-shadow: 0 0 15px rgba(255, 71, 87, 0.3); }
        .card img { width: 100%; height: auto; border-radius: 10px; display: block; }

        #scoreboard { display: flex; justify-content: center; flex-wrap: wrap; gap: 10px; margin-bottom: 20px; }
        .player-score { background: white; padding: 10px 20px; border-radius: 20px; border: 2px solid #3498db; cursor: pointer; min-width: 80px; }
        .active-player { background: #3498db; color: white; transform: scale(1.1); }
        
        .controls { margin-top: 20px; }
        button { padding: 10px 20px; font-size: 16px; cursor: pointer; border-radius: 5px; border: none; background: #2ecc71; color: white; margin: 5px; }
        button:hover { background: #27ae60; }
        .mode-select { margin: 20px 0; padding: 10px; border-top: 1px solid #eee; }
        #player-buttons button { background: #95a5a6; } /* 初期状態の色 */
    </style>
</head>
<body>

    <div id="setup-screen">
        <h1>SET Game</h1>
        <p>1. 対戦人数を選んでください</p>
        <div id="player-buttons">
            </div>
        
        <div class="mode-select">
            <p>2. オプション</p>
            <label style="font-size: 18px; cursor: pointer;">
                <input type="checkbox" id="ai-checkbox" style="transform: scale(1.5); margin-right: 10px;"> AIと対戦する 🤖
            </label>
        </div>
        
        <button onclick="confirmStart()" style="background: #3498db; font-weight: bold; padding: 15px 40px; margin-top: 20px;">ゲーム開始！</button>
    </div>

    <div id="game-screen">
        <div id="scoreboard"></div>
        <div id="status" style="margin-bottom: 10px; font-weight: bold;"></div>
        <div id="field"></div>
        <div class="controls">
            <button onclick="addCards()">カードを3枚追加 (a)</button>
            <button onclick="resetSelection()" style="background:#95a5a6">選択リセット</button>
            <button onclick="location.reload()" style="background:#e74c3c">タイトルに戻る</button>
        </div>
    </div>

    <script>
        // --- 共通の変数 ---
        let deck = [], field = [], selectedIndices = [], players = [], currentPlayer = null;
        let aiActive = false, aiTimer = null, selectedPlayerCount = 1;

        // --- 画面が読み込まれた時にボタンを作る ---
        window.onload = function() {
            const pButtons = document.getElementById('player-buttons');
            for (let i = 1; i <= 5; i++) {
                let btn = document.createElement('button');
                btn.innerText = `${i}人`;
                btn.id = `p-btn-${i}`;
                // 最初は「1人」を選択状態にする
                if (i === 1) btn.style.background = "#3498db";
                
                btn.onclick = function() {
                    selectedPlayerCount = i;
                    // 他のボタンの色を戻し、選んだボタンだけ色を変える
                    for(let j=1; j<=5; j++) {
                        document.getElementById(`p-btn-${j}`).style.background = "#95a5a6";
                    }
                    this.style.background = "#3498db";
                };
                pButtons.appendChild(btn);
            }
        };

        // --- ゲーム開始の処理 ---
        function confirmStart() {
            aiActive = document.getElementById('ai-checkbox').checked;
            startGame(selectedPlayerCount);
        }

        function startGame(num) {
            players = Array.from({length: num}, (_, i) => ({ id: i + 1, score: 0 }));
            if (aiActive) {
                players.push({ id: "AI", score: 0 });
            }
            
            document.getElementById('setup-screen').style.display = 'none';
            document.getElementById('game-screen').style.display = 'block';
            
            initDeck();
            deal(12);
            render();
            if (aiActive) startAI();
        }

        // 山札の作成
        function initDeck() {
            deck = [];
            for (let c=0; c<3; c++) for (let s=0; s<3; s++) for (let n=0; n<3; n++) for (let f=0; f<3; f++)
                deck.push({c, s, n, f});
            deck.sort(() => Math.random() - 0.5);
        }

        function deal(count) {
            const toDeal = Math.min(count, deck.length);
            if (toDeal > 0) field.push(...deck.splice(0, toDeal));
        }

        // 描画処理
        function render() {
            // スコアボード
            const scoreDiv = document.getElementById('scoreboard');
            scoreDiv.innerHTML = players.map(p => `
                <div class="player-score ${currentPlayer === p.id ? 'active-player' : ''}" 
                     onclick="setCurrentPlayer('${p.id}')">
                    ${p.id === 'AI' ? '🤖 AI' : '👤 P' + p.id}: ${p.score}
                </div>
            `).join('');

            // フィールド
            const fieldDiv = document.getElementById('field');
            fieldDiv.innerHTML = field.map((card, i) => {
                const fileName = `cards/card_${card.c}_${card.s}_${card.n}_${card.f}.png`;
                return `
                    <div class="card ${selectedIndices.includes(i) ? 'selected' : ''}" onclick="selectCard(${i})">
                        <img src="${fileName}" alt="SET Card">
                    </div>
                `;
            }).join('');
            
            const setsFound = findAllSets();
            document.getElementById('status').innerText = `山札: ${deck.length}枚 | 場にあるSET: ${setsFound.length}個`;
        }

        function setCurrentPlayer(id) {
            if (id === 'AI') return;
            // IDが数字なら数値に変換、そうでなければそのまま（文字列など）
            currentPlayer = isNaN(id) ? id : parseInt(id);
            render();
        }

        function selectCard(index) {
            // 2人以上（またはAIあり）の場合はプレイヤー選択を必須にする
            if (players.length > 1 && !currentPlayer) {
                alert("先に自分のプレイヤー名（P1など）をクリックしてください！"); 
                return;
            }
            if (selectedIndices.includes(index)) {
                selectedIndices = selectedIndices.filter(i => i !== index);
            } else {
                selectedIndices.push(index);
            }
            if (selectedIndices.length === 3) checkSet();
            render();
        }

        function checkSet() {
            const cards = selectedIndices.map(i => field[i]);
            const isSet = ['c', 's', 'n', 'f'].every(p => (cards[0][p] + cards[1][p] + cards[2][p]) % 3 === 0);
            
            if (isSet) {
                alert(`正解！ポイント獲得！`);
                let pId = currentPlayer || 1;
                players.find(p => p.id === pId).score++;
                // 正解したカードを消す
                selectedIndices.sort((a,b) => b-a).forEach(i => field.splice(i, 1));
            } else {
                alert("残念、SETではありません...");
            }
            resetSelection();
        }

        function resetSelection() {
            selectedIndices = [];
            currentPlayer = null;
            render();
        }

        function addCards() {
            if (deck.length >= 3) {
                deal(3);
                render();
            } else {
                alert("山札がもうありません！");
            }
        }

        // --- AIロジック ---
        function startAI() {
            if (!aiActive) return;
            aiTimer = setTimeout(() => {
                const sets = findAllSets();
                if (sets.length > 0) {
                    alert("🤖 AIがSETを見つけました！");
                    players.find(p => p.id === "AI").score++;
                    sets[0].sort((a,b) => b-a).forEach(i => field.splice(i, 1));
                    selectedIndices = [];
                    render();
                } else if (deck.length > 0) {
                    addCards();
                }
                startAI();
            }, 10000); // 10秒ごとに思考
        }

        function findAllSets() {
            let sets = [];
            for (let i=0; i<field.length; i++)
                for (let j=i+1; j<field.length; j++)
                    for (let k=j+1; k<field.length; k++) {
                        const c = [field[i], field[j], field[k]];
                        if (['c','s','n','f'].every(p => (c[0][p]+c[1][p]+c[2][p])%3===0)) sets.push([i,j,k]);
                    }
            return sets;
        }
    </script>
</body>
</html>
